<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1125 450" width="1125" height="450">
<!-- a piece of full-logo.svg for the logo build-up on a first visit or refresh (scripts.js) --><style>#lbar-m path{fill:none;stroke:#fff;stroke-width:40;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;animation:lbar-d 650ms cubic-bezier(.65,0,.35,1) forwards}@keyframes lbar-d{to{stroke-dashoffset:0}}.lbar-tg,.lbar-tc{fill:none;stroke-linecap:round;stroke-dasharray:.03 2;stroke-dashoffset:.03;animation:lbar-t 650ms cubic-bezier(.65,0,.35,1) forwards,lbar-f 300ms ease-out 590ms forwards}.lbar-tg{stroke:#ff7a1a;stroke-width:14;filter:url(#lbar-tb);opacity:.85}.lbar-tc{stroke:#ffd9b0;stroke-width:4}@keyframes lbar-t{to{stroke-dashoffset:-.97}}@keyframes lbar-f{to{opacity:0}}.lbar-late{opacity:0;animation:lbar-p .25s ease-out 570ms forwards}.lbar-early{opacity:0;animation:lbar-p .25s ease-out forwards}@keyframes lbar-p{to{opacity:1}}</style><defs><filter id="lbar-tb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter><mask id="lbar-m" maskUnits="userSpaceOnUse" x="0" y="0" width="1125" height="450"><path pathLength="1" d="M740 172 C740 144 788 144 788 172"/></mask>
<filter id="lbar-sh" x="-5%" y="-10%" width="115%" height="130%" color-interpolation-filters="sRGB"><feFlood flood-color="#000" flood-opacity=".45"/><feComposite in2="SourceAlpha" operator="in"/><feGaussianBlur stdDeviation="4"/><feOffset dx="4" dy="6"/></filter>
<filter id="lbar-bl" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2"/></filter>
<clipPath id="lbar-front"><rect x="200" y="200" width="680" height="165"/></clipPath>
<clipPath id="lbar-in"><rect x="205" y="162" width="787" height="190"/></clipPath>
</defs>
<g mask="url(#lbar-m)"><g fill="none" stroke-linecap="round"><g stroke="#000" stroke-opacity=".5" stroke-width="11" transform="translate(2 3)" filter="url(#lbar-bl)"><path d="M740 172 C740 144 788 144 788 172"/></g><g stroke="#1b1b1b" stroke-width="10"><path d="M740 172 C740 144 788 144 788 172"/></g><g stroke="#6a6a6a" stroke-opacity=".7" stroke-width="2" transform="translate(-1.8 -1.8)"><path d="M740 172 C740 144 788 144 788 172"/></g><g stroke="#050505" stroke-width="10.5" stroke-linecap="butt" stroke-dasharray="3 3"><path d="M740 172 C740 144 788 144 788 172"/></g><g stroke="#5a5a5a" stroke-width="4.5" stroke-linecap="butt" stroke-dasharray="3 3" stroke-dashoffset="3" transform="translate(-1 -1.5)"><path d="M740 172 C740 144 788 144 788 172"/></g><g stroke="#333" stroke-width="4.5" stroke-linecap="butt" stroke-dasharray="3 3" transform="translate(1 1.5)"><path d="M740 172 C740 144 788 144 788 172"/></g></g>
