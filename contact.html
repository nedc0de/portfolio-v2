  <!--===== CONTACT =====-->
  <main class="l-main ct">

    <!--===== INTRO =====-->
    <section class="ct-hero favorites-title">
      <h1 class="about-title section-title">
        let's
        <span class="about-title-color">Talk</span>
      </h1>
      <p class="ct-lead">Tell me what you're working on, or just say <em>what's up</em>. Short is fine.</p>
    </section>

    <!--===== FORM =====-->
    <form name="contact" method="POST" class="ct-form" data-netlify="true" netlify-honeypot="bot-field">
      <p class="ct-trap"><label>Leave this empty: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>

      <fieldset class="ct-topics">
        <legend class="ct-label">What's this about?</legend>
        <div class="ct-topic-row">
          <label><input type="radio" name="topic" value="Project" checked><span>Project</span></label>
          <label><input type="radio" name="topic" value="Collab"><span>Collab</span></label>
          <label><input type="radio" name="topic" value="Say hi"><span>Say hi</span></label>
        </div>
      </fieldset>

      <div class="ct-row">
        <div class="ct-field">
          <label class="ct-label" for="name">Name</label>
          <input type="text" id="name" name="name" class="ct-input" autocomplete="name" required>
        </div>
        <div class="ct-field">
          <label class="ct-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="ct-input" autocomplete="email" required>
        </div>
      </div>

      <div class="ct-field">
        <label class="ct-label" for="textbox">Message</label>
        <textarea id="textbox" name="message" rows="6" class="ct-input" placeholder="What are you building? Links, timeline, anything that helps." required></textarea>
        <span class="ct-meter" aria-hidden="true"><i></i></span>
        <span id="char_count" class="char-count ct-count">250/250</span>
      </div>

      <button type="submit" class="ct-send">Send message</button>
    </form>

    <!--===== OTHER WAYS =====-->
    <section class="ct-alt">
      <p class="ct-label">Prefer a DM?</p>
      <div class="ct-dm">
        <span class="ct-dm-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M19.598 8.531C18.756 5.327 16.128 3 12.016 3c-5.062 0-7.875 3.526-7.875 7.875v2.25c0 4.35 2.813 7.875 7.875 7.875c1.812 0 3.313-.422 4.5-1.153c1.206-.743 2.02-1.794 2.25-3.082c.96-5.377-6.53-5.89-8.437-4.765c-2.167 1.278-.914 3.63.21 4.078c1.41.563 3.398.356 4.395-1.16c1.008-1.531.986-5.11-.386-6.387c-1.373-1.277-4.22-1.594-5.45.375"/></svg></span>
        <span class="ct-dm-text"><small>Message me on Threads</small><a class="ct-dm-handle" href="https://www.threads.com/@nedcodev/" target="_blank" rel="noopener">@nedcodev</a></span>
        <a class="ct-open" href="https://www.threads.com/@nedcodev/" target="_blank" rel="noopener" aria-label="Open @nedcodev on Threads">Open</a>
      </div>
    </section>
